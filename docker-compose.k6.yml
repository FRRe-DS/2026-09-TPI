services:
  db-k6:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: m9_test
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d m9_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-k6:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db-k6:5432/m9_test
      DB_SSL: "false"
      ANTICIPACION_MINIMA_MINUTOS: 60
      ANTICIPACION_MAXIMA_DIAS: 30
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      db-k6:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  k6:
    image: grafana/k6:latest
    profiles: ["run"]
    environment:
      BASE_URL: http://api-k6:3000
      K6_VUS: ${K6_VUS:-10}
      K6_DURATION: ${K6_DURATION:-15s}
    volumes:
      - ./k6:/scripts:ro
    command: ["run", "/scripts/reservas-load.js"]
    depends_on:
      api-k6:
        condition: service_healthy
